# Baut termine.ics aus termine.js, sobald termine.js geändert wird.
# termine.ics ist der Kalender zum Abonnieren (Apple Kalender, Google Kalender, Outlook).
name: Kalender-Datei bauen

on:
  push:
    paths:
      - "termine.js"
      - "kalender-ics.js"
  workflow_dispatch:         # Knopf "Run workflow" zum Starten von Hand

permissions:
  contents: write

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: termine.ics erzeugen
        run: node kalender-ics.js termine.js termine.ics

      - name: Speichern, wenn sich etwas geändert hat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add termine.ics
          git diff --cached --quiet || (git commit -m "Kalender-Datei aktualisiert" && git pull --rebase && git push)
