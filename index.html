<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Semesterplaner – Apple-Vergleich</title>
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: Eingabe (nur Bearbeitungsmodus), "Als Nächstes", Wochenraster oder Liste.
   Farben: jedes Fach hat einen festen Farbton, Tutorien sind immer Bernstein mit Strichrand, Klausuren Rot, Sonstiges Grau.
   Flächen bekommen weiche, halbtransparente Schatten statt harter Rahmen. Bewegung nur als Rückmeldung beim Drücken. */
:root {
  --bg: #fafafa; --surface: #ffffff; --sunken: #f1f1f3; --fg: #18181b; --muted: #6b6b74; --faint: #a1a1aa;
  --line: rgb(0 0 0 / 0.075); --line-faint: rgb(0 0 0 / 0.035);
  --accent: #2563eb; --accent-fg: #ffffff; --accent-soft: rgb(37 99 235 / 0.07);
  --danger: #c4231a; --danger-soft: rgb(196 35 26 / 0.08); --now: #e5484d;
  --ring: 0 0 0 1px rgb(0 0 0 / 0.07);
  --shadow-sm: 0 0 0 1px rgb(0 0 0 / 0.06), 0 1px 2px rgb(0 0 0 / 0.04);
  --shadow-md: 0 0 0 1px rgb(0 0 0 / 0.06), 0 1px 2px rgb(0 0 0 / 0.04), 0 6px 16px -6px rgb(0 0 0 / 0.08);
  --ev-s: 62%; --ev-bg-l: 94%; --ev-fg-l: 24%; --ev-line-l: 50%;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --font-ui: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r-lg: 14px; --r-md: 10px; --r-sm: 7px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0b0c; --surface: #151517; --sunken: #1d1d20; --fg: #ececee; --muted: #9d9da6; --faint: #6b6b74;
    --line: rgb(255 255 255 / 0.075); --line-faint: rgb(255 255 255 / 0.035);
    --accent: #6d9bff; --accent-fg: #0b1220; --accent-soft: rgb(109 155 255 / 0.09);
    --danger: #ff8a80; --danger-soft: rgb(255 138 128 / 0.1); --now: #ff6369;
    --ring: 0 0 0 1px rgb(255 255 255 / 0.08);
    --shadow-sm: 0 0 0 1px rgb(255 255 255 / 0.07), 0 1px 2px rgb(0 0 0 / 0.4);
    --shadow-md: 0 0 0 1px rgb(255 255 255 / 0.07), 0 1px 2px rgb(0 0 0 / 0.4), 0 8px 24px -8px rgb(0 0 0 / 0.6);
    --ev-s: 45%; --ev-bg-l: 20%; --ev-fg-l: 88%; --ev-line-l: 62%; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0b0c; --surface: #151517; --sunken: #1d1d20; --fg: #ececee; --muted: #9d9da6; --faint: #6b6b74;
  --line: rgb(255 255 255 / 0.075); --line-faint: rgb(255 255 255 / 0.035);
  --accent: #6d9bff; --accent-fg: #0b1220; --accent-soft: rgb(109 155 255 / 0.09);
  --danger: #ff8a80; --danger-soft: rgb(255 138 128 / 0.1); --now: #ff6369;
  --ring: 0 0 0 1px rgb(255 255 255 / 0.08);
  --shadow-sm: 0 0 0 1px rgb(255 255 255 / 0.07), 0 1px 2px rgb(0 0 0 / 0.4);
  --shadow-md: 0 0 0 1px rgb(255 255 255 / 0.07), 0 1px 2px rgb(0 0 0 / 0.4), 0 8px 24px -8px rgb(0 0 0 / 0.6);
  --ev-s: 45%; --ev-bg-l: 20%; --ev-fg-l: 88%; --ev-line-l: 62%; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 15px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; font-feature-settings: "ss01";
  padding-block: max(28px, env(safe-area-inset-top, 0px)) max(56px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
[hidden] { display: none !important; }
.wrap { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
::selection { background: var(--accent-soft); }

header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { margin: 0; font-size: 1.75rem; font-weight: 650; letter-spacing: -0.03em; line-height: 1.15; text-wrap: balance; }
#status:not(:empty) { font-size: 0.78rem; color: var(--muted); padding: 3px 10px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow-sm); }

.panel { background: var(--surface); box-shadow: var(--shadow-sm); border-radius: var(--r-lg); padding: 16px; }
.cap { display: block; font-size: 0.7rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.add textarea {
  width: 100%; margin-top: 10px; min-height: 104px; resize: vertical; padding: 10px 12px;
  background: var(--sunken); border: 0; box-shadow: inset var(--ring); border-radius: var(--r-md); font-family: var(--font-num); font-size: 0.85rem; line-height: 1.55;
}
.ctl { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; margin-top: 12px; }
.ctl input[type="text"] { flex: 1 1 200px; min-width: 0; padding: 8px 10px; background: var(--sunken); border: 0; box-shadow: inset var(--ring); border-radius: var(--r-md); }
@media (pointer: coarse) { .add textarea, .ctl input[type="text"] { font-size: 16px; } }

/* Knöpfe: kurzes Eindrücken beim Tippen, Hover nur mit Maus */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 34px;
  background: var(--fg); color: var(--bg); border: 0; border-radius: var(--r-md); padding: 7px 14px; font-weight: 550; font-size: 0.9rem; line-height: 1.2;
}
.btn:disabled { opacity: 0.4; cursor: default; }
.btn.ghost { background: var(--surface); color: var(--fg); box-shadow: var(--shadow-sm); font-weight: 500; padding: 7px 12px; }
.btn.ghost[aria-pressed="true"] { background: var(--fg); color: var(--bg); box-shadow: none; }
.btn.danger { background: var(--danger-soft); color: var(--danger); font-weight: 500; padding: 7px 12px; }
.btn.danger.armed { background: var(--danger); color: var(--surface); }
#preview, #addmsg, .note { font-size: 0.85rem; color: var(--muted); }
#preview { margin-top: 8px; min-height: 1.3em; }
#addmsg { color: var(--fg); }

#photobox { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
#photobox .ctl { margin-top: 6px; }
#photolist { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
#photolist label { display: flex; gap: 10px; align-items: baseline; padding: 8px 10px; background: var(--sunken); border-radius: var(--r-md); font-size: 0.85rem; }
#photolist .num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

.editbar { box-shadow: 0 0 0 1px var(--accent), var(--shadow-sm); }
.editbar p { margin: 6px 0 0; font-size: 0.85rem; color: var(--muted); }

/* Farbmodell der Termine */
.k-vorlesung { --sat: var(--ev-s); }
.k-tutorium { --h: 42 !important; --sat: 88%; }
.k-pruefung { --h: 4 !important; --sat: 75%; }
.k-sonstiges { --h: 215 !important; --sat: 12%; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; background: hsl(var(--h) var(--sat, var(--ev-s)) var(--ev-line-l)); }
.tag { font-size: 0.62rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; padding: 1px 6px; border-radius: 5px; color: hsl(var(--h) var(--sat, var(--ev-s)) var(--ev-fg-l)); background: hsl(var(--h) var(--sat, var(--ev-s)) var(--ev-bg-l)); box-shadow: inset 0 0 0 1px hsl(var(--h) var(--sat, var(--ev-s)) var(--ev-line-l) / 0.35); white-space: nowrap; }

/* Als Nächstes */
#next { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; }
#next:empty { display: none; }
.nx {
  --h: 215; position: relative; text-align: left; background: var(--surface); border: 0; border-radius: var(--r-lg); padding: 12px 14px 12px 18px;
  box-shadow: var(--shadow-md); min-width: 0; display: flex; flex-direction: column; gap: 2px; overflow: hidden;
}
.nx::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: hsl(var(--h) var(--sat, var(--ev-s)) var(--ev-line-l)); }
.nx.k-tutorium::before { background: repeating-linear-gradient(to bottom, hsl(var(--h) var(--sat) var(--ev-line-l)) 0 6px, transparent 6px 10px); }
.nx .when { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.nx .tm { font-family: var(--font-num); font-size: 0.88rem; font-variant-numeric: tabular-nums; color: var(--muted); }
.nx .tt { font-weight: 600; font-size: 1rem; letter-spacing: -0.01em; overflow-wrap: anywhere; margin-top: 2px; }
.nx .pf { font-size: 0.82rem; color: var(--muted); overflow-wrap: anywhere; }

/* Ansicht, Navigation, Filter */
.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.tabs { display: inline-flex; gap: 2px; padding: 3px; border-radius: calc(var(--r-md) + 3px); background: var(--sunken); box-shadow: inset var(--ring); }
.tabs button { border: 0; background: transparent; color: var(--muted); padding: 6px 16px; border-radius: var(--r-md); font-weight: 500; font-size: 0.9rem; }
.tabs button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow-sm); }
.nav { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.nav .lbl { font-weight: 600; text-align: center; font-variant-numeric: tabular-nums; padding: 0 6px; letter-spacing: -0.01em; }
.nav .kw { color: var(--muted); font-weight: 500; font-size: 0.75rem; margin-left: 4px; padding: 1px 6px; border-radius: 5px; background: var(--sunken); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  --h: 215; display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border-radius: 999px; border: 0;
  background: var(--surface); box-shadow: var(--shadow-sm); font-size: 0.82rem; max-width: 100%; text-align: left;
}
.chip[aria-pressed="false"] { opacity: 0.45; text-decoration: line-through; box-shadow: inset var(--ring); background: transparent; }
.chip small { color: var(--faint); font-family: var(--font-num); font-size: 0.72rem; font-variant-numeric: tabular-nums; }

/* Wochenraster */
.scroll { overflow-x: auto; background: var(--surface); box-shadow: var(--shadow-md); border-radius: var(--r-lg); overscroll-behavior-x: contain; }
.wk { display: grid; grid-template-columns: 3.2rem repeat(var(--nd), minmax(0, 1fr)); min-width: 640px; }
.dh { padding: 10px 4px 8px; text-align: center; border-bottom: 1px solid var(--line); border-left: 1px solid var(--line-faint); font-size: 0.72rem; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
.dh b {
  display: grid; place-items: center; width: 30px; height: 30px; margin: 3px auto 0; border-radius: 50%;
  font-size: 1rem; color: var(--fg); font-weight: 600; letter-spacing: -0.01em; text-transform: none; font-variant-numeric: tabular-nums;
}
.dh.today { color: var(--accent); }
.dh.today b { background: var(--accent); color: var(--accent-fg); }
.corner { border-bottom: 1px solid var(--line); }
.gut { position: relative; }
.gut span { position: absolute; right: 8px; font-family: var(--font-num); font-size: 0.66rem; color: var(--faint); transform: translateY(-50%); font-variant-numeric: tabular-nums; }
.col {
  position: relative; border-left: 1px solid var(--line-faint);
  background-image:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(transparent calc(var(--hh) / 2), var(--line-faint) calc(var(--hh) / 2), var(--line-faint) calc(var(--hh) / 2 + 1px), transparent calc(var(--hh) / 2 + 1px));
  background-size: 100% var(--hh);
}
.col.today { background-color: var(--accent-soft); }
.ev {
  --h: 215; position: absolute; text-align: left; overflow: hidden; padding: 4px 7px 4px 9px; border-radius: var(--r-sm); line-height: 1.25; font-size: 0.76rem;
  background: hsl(var(--h) var(--sat, var(--ev-s)) var(--ev-bg-l)); color: hsl(var(--h) var(--sat, var(--ev-s)) var(--ev-fg-l));
  border: 1px solid hsl(var(--h) var(--sat, var(--ev-s)) var(--ev-line-l) / 0.3);
  box-shadow: inset 3px 0 0 hsl(var(--h) var(--sat, var(--ev-s)) var(--ev-line-l));
}
.ev.k-tutorium { border: 1.5px dashed hsl(var(--h) var(--sat, var(--ev-s)) var(--ev-line-l) / 0.85); box-shadow: none; padding-left: 7px; }
.ev.sel { outline: 2px solid var(--fg); outline-offset: 1px; z-index: 2; }
.ev .t { display: block; font-family: var(--font-num); font-size: 0.66rem; opacity: 0.8; font-variant-numeric: tabular-nums; }
.ev .n { display: block; font-weight: 600; overflow-wrap: anywhere; letter-spacing: -0.005em; }
.ev .p { display: block; opacity: 0.8; overflow-wrap: anywhere; }
.ev .tg { font-size: 0.58rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.85; }
.ev.live { border-color: hsl(var(--h) var(--sat, var(--ev-s)) var(--ev-line-l)); box-shadow: inset 3px 0 0 hsl(var(--h) var(--sat, var(--ev-s)) var(--ev-line-l)), 0 0 0 3px hsl(var(--h) var(--sat, var(--ev-s)) var(--ev-line-l) / 0.18); }
.ev.k-tutorium.live { box-shadow: 0 0 0 3px hsl(var(--h) var(--sat, var(--ev-s)) var(--ev-line-l) / 0.18); }
.ev .left, .nx .left { display: block; font-family: var(--font-num); font-weight: 600; font-variant-numeric: tabular-nums; color: var(--now); }
.ev .left { font-size: 0.68rem; }
.nx .left { font-size: 0.8rem; }

/* Jetzt-Linie in der heutigen Spalte */
.nowline { position: absolute; left: -1px; right: 0; height: 0; border-top: 2px solid var(--now); z-index: 3; pointer-events: none; }
.nowline::before { content: ""; position: absolute; left: -5px; top: -6px; width: 10px; height: 10px; border-radius: 50%; background: var(--now); box-shadow: 0 0 0 2px var(--surface); }
.gut .nowlbl { right: 4px; padding: 1px 5px; border-radius: 5px; background: var(--now); color: #fff; font-weight: 600; z-index: 1; }

/* Mensa: große Fotokarten für Hauptgerichte, kompakte Zeilen mit Vorschaubild für Beilagen */
.mz { display: flex; flex-direction: column; gap: 6px; }
.mz .mh:first-child { margin-top: 0; }
.mgrid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.dish { background: var(--surface); box-shadow: var(--shadow-md); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.ph { position: relative; overflow: hidden; background: var(--sunken); display: grid; place-items: center; isolation: isolate; }
.dish .ph { aspect-ratio: 16 / 11; }
.ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transform: scale(1.03); }
.ph img.ok { opacity: 1; transform: none; }
.ph .fb { font-size: 2.6rem; line-height: 1; opacity: 0.9; }
.ph.wait::before { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgb(255 255 255 / 0.35) 50%, transparent 70%); background-size: 220% 100%; animation: shimmer 1.3s linear infinite; z-index: 1; }
@keyframes shimmer { from { background-position: 120% 0; } to { background-position: -120% 0; } }
.dish .ph::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgb(0 0 0 / 0.28), transparent 32%, transparent 70%, rgb(0 0 0 / 0.22)); pointer-events: none; z-index: 1; }
.ph .glass { position: absolute; z-index: 2; font-size: 0.7rem; font-weight: 600; padding: 4px 9px; border-radius: 999px; background: rgb(255 255 255 / 0.86); color: #18181b; -webkit-backdrop-filter: blur(10px) saturate(1.4); backdrop-filter: blur(10px) saturate(1.4); box-shadow: 0 1px 2px rgb(0 0 0 / 0.12); white-space: nowrap; max-width: calc(100% - 24px); overflow: hidden; text-overflow: ellipsis; }
.ph .glass.cat { left: 12px; top: 12px; letter-spacing: 0.02em; }
.ph .glass.price { right: 12px; top: 12px; font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 0.8rem; }
.ph .glass.sym { left: 12px; bottom: 12px; font-weight: 500; font-size: 0.62rem; background: rgb(0 0 0 / 0.45); color: #fff; text-decoration: none; box-shadow: none; }
.dish .bd { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.dish .nm { font-weight: 600; font-size: 1.02rem; letter-spacing: -0.015em; line-height: 1.3; overflow-wrap: anywhere; text-wrap: pretty; }
.dish .sub { font-size: 0.82rem; color: var(--muted); overflow-wrap: anywhere; }
.dish .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.dish .tg2 { font-size: 0.68rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: rgb(34 160 90 / 0.12); color: rgb(22 120 64); }
.dish .others { margin-top: auto; padding-top: 10px; font-size: 0.74rem; color: var(--muted); font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.mlist { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.mrow { display: flex; gap: 12px; align-items: center; padding: 8px; padding-right: 14px; background: var(--surface); box-shadow: var(--shadow-sm); border-radius: 14px; min-width: 0; }
.mrow .ph { width: 60px; height: 60px; flex: none; border-radius: 10px; }
.mrow .ph .fb { font-size: 1.6rem; }
.mrow .tx { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 1px; }
.mrow .c { font-size: 0.66rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.mrow .nm { font-size: 0.9rem; font-weight: 500; overflow-wrap: anywhere; line-height: 1.3; }
.mrow .pr { font-family: var(--font-num); font-size: 0.85rem; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.mz .note { margin: 14px 0 0; max-width: 65ch; }
@media (prefers-reduced-motion: no-preference) { .ph img { transition: opacity 280ms ease, transform 420ms var(--ease-out); } }
@media (prefers-reduced-motion: reduce) { .ph.wait::before { animation: none; } }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .dish .tg2 { color: rgb(120 220 160); } :root:not([data-theme="light"]) .ph.wait::before { background-image: linear-gradient(100deg, transparent 30%, rgb(255 255 255 / 0.06) 50%, transparent 70%); } }

/* Wetter */
.wx { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px 22px; align-items: center; padding: 14px 16px; }
.wx .now { display: flex; align-items: center; gap: 12px; }
.wx .ic { font-size: 2.3rem; line-height: 1; }
.wx .t { font-size: 2rem; font-weight: 600; letter-spacing: -0.04em; line-height: 1; font-variant-numeric: tabular-nums; }
.wx .d { font-size: 0.82rem; color: var(--muted); margin-top: 3px; }
.wx .d b { color: var(--fg); font-weight: 600; }
.wx .hrs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; overscroll-behavior-x: contain; -webkit-mask-image: linear-gradient(to right, #000 88%, transparent); mask-image: linear-gradient(to right, #000 88%, transparent); padding-right: 24px; }
.wx .hrs::-webkit-scrollbar { display: none; }
.wx .h { flex: none; min-width: 48px; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 4px; border-radius: var(--r-md); font-variant-numeric: tabular-nums; }
.wx .h:first-child { background: var(--sunken); }
.wx .h .hh { font-family: var(--font-num); font-size: 0.66rem; color: var(--muted); }
.wx .h .hi { font-size: 1.15rem; line-height: 1.1; }
.wx .h .ht { font-size: 0.82rem; font-weight: 600; }
.wx .h .hp { font-size: 0.64rem; color: #2f7ae5; font-weight: 600; min-height: 1em; }
.wx .src { grid-column: 1 / -1; font-size: 0.68rem; color: var(--faint); margin-top: -6px; }
.wx .src a { color: inherit; }
.wx.err { display: block; color: var(--muted); font-size: 0.85rem; }
.dh .dw { display: block; margin-top: 3px; font-size: 0.68rem; letter-spacing: 0; text-transform: none; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
@media (max-width: 560px) { .wx { grid-template-columns: minmax(0, 1fr); gap: 10px; } .wx .src { margin-top: 0; } }

/* Anfahrt */
.hdr-r { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
#travelbtn .pill { font-size: 0.7rem; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--sunken); color: var(--muted); font-variant-numeric: tabular-nums; }
#travelbtn.on .pill { background: rgb(22 163 74 / 0.14); color: rgb(21 128 61); }
.tp { display: flex; flex-direction: column; gap: 12px; }

<div class="wrap">
  <header>

      <span id="status" role="status"></span>

<script>
//<parse>
const WD_RE = "(?:montag|dienstag|mittwoch|donnerstag|freitag|samstag|sonntag|mo|di|mi|do|fr|sa|so)";
const WD = new RegExp("^" + WD_RE + "\\b\\.?,?\\s*", "i");
const WD_END = new RegExp("[\\s,]*\\b" + WD_RE + "\\b\\.?,?\\s*$", "i");
const DATE_RE = /(\d{1,2})\.\s?(\d{1,2})\.\s?(\d{4}|\d{2}(?![\d:]))?[^\d]*?(\d{1,2})[:.](\d{2})\s*(?:[–—-]|bis)\s*(\d{1,2})[:.](\d{2})/;
function headKind(line) {
  const m = /^(tutorium|tut\.?)\s*[-–—:]?\s*(.*)$/i.exec(line);
  if (m) return { kind: "tutorium", title: m[2].trim() };
  const k = /^(klausur|prüfung)\s*[-–—:]?\s*(.*)$/i.exec(line);
  if (k) return { kind: "pruefung", title: (line).trim() };
  const v = /^vorlesung\s*[-–—:]?\s*(.*)$/i.exec(line);
  if (v) return { kind: "vorlesung", title: v[1].trim() };
  return { kind: "vorlesung", title: line.trim() };
}
function parseEvents(text, nowYear) {
  const out = [];
  let head = null;
  for (const raw of String(text).split(/\r?\n/)) {
    const line = raw.trim();
    if (!line) continue;
    const m = DATE_RE.exec(line);
    if (!m) {
      const t = line.replace(/^[#*•\-\s]+/, "").trim();
      if (t && !/^uhr$/i.test(t)) head = headKind(t);
      continue;
    }
    const prefix = line.slice(0, m.index).replace(WD, "").replace(WD_END, "").replace(/[:\-–—,\s]+$/, "").trim();
    if (prefix) head = headKind(prefix);
    let [, d, mo, y, h1, i1, h2, i2] = m;
    d = +d; mo = +mo; h1 = +h1; i1 = +i1; h2 = +h2; i2 = +i2;
    y = y ? (y.length === 2 ? 2000 + +y : +y) : nowYear;
    const dt = new Date(y, mo - 1, d);
    if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d) continue;
    if (h1 > 23 || h2 > 24 || i1 > 59 || i2 > 59 || h2 * 60 + i2 <= h1 * 60 + i1) continue;
    const p = (n) => String(n).padStart(2, "0");
    const h = head || { kind: "vorlesung", title: "Termin" };
    out.push({ title: h.title || "Termin", kind: h.kind, prof: "", room: "", date: `${y}-${p(mo)}-${p(d)}`, start: `${p(h1)}:${p(i1)}`, end: `${p(h2)}:${p(i2)}` });
  }
  return out;
}
//</parse>

const $ = (s) => document.querySelector(s);
const pad = (n) => String(n).padStart(2, "0");
const key = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseKey = (k) => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const mins = (t) => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const monday = (d) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
const fmt = (d, o) => new Intl.DateTimeFormat("de-DE", o).format(d);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const isoWeek = (d) => {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  t.setUTCDate(t.getUTCDate() - ((t.getUTCDay() + 6) % 7) + 3);
  const fy = new Date(Date.UTC(t.getUTCFullYear(), 0, 4));
  return 1 + Math.round(((t - fy) / 864e5 - 3 + ((fy.getUTCDay() + 6) % 7)) / 7);
};

const HUE = {

async function addEvents(list) {
  const have = new Set(all().map(ckey));
  const added = []; let dup = 0;
  for (const x of list) {
    const e = clean(x);
    if (!e.prof) e.prof = profFor(e.title, e.kind);
    if (have.has(ckey(e))) { dup++; continue; }
    have.add(ckey(e));
    await saveEv(newId(), e);
    added.push(e);
  }
  if (added.length) {
    const today = key(new Date());
    const ds = added.map((x) => x.date).sort();
    weekStart = monday(parseKey(ds.find((d) => d >= today) || ds[0]));
  }
  return { added: added.length, dup };
}

}

function layoutDay(evs) {
  evs.sort((x, y) => x.a - y.a || x.b - y.b);
  const res = []; let cluster = []; let end = 0;
  const flush = () => { const n = Math.max(...cluster.map((c) => c.lane)) + 1; cluster.forEach((c) => { c.n = n; }); res.push(...cluster); cluster = []; };
  for (const ev of evs) {
    if (cluster.length && ev.a >= end) { flush(); end = 0; }
    const used = cluster.filter((c) => c.b > ev.a).map((c) => c.lane);
    let l = 0; while (used.includes(l)) l++;
    ev.lane = l; cluster.push(ev); end = Math.max(end, ev.b);
  }
  if (cluster.length) flush();
  return res;
}

  let extra = "";

let liveSig = "";
function liveSignature() {
  const today = key(new Date()), m = nowMin();
  const running = all().filter((e) => e.date === today && e.a <= m && m < e.b).map((e) => e.id);
  const nx = upcoming().slice(0, 3).map((e) => e.id);

}
function leftText(sec) {
  return `noch ${Math.floor(sec / 60)} min ${pad(sec % 60)} s`;
}
function tick() {
  const now = new Date();
  /* Wenn ein Termin anfängt oder endet (oder ein neuer Tag beginnt), alles neu zeichnen */
  if (liveSignature() !== liveSig) { if (view === "mensa") { liveSig = liveSignature(); renderNext(); } else { render(); return; } }
  const secs = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
  document.querySelectorAll(".depleft[data-dep]").forEach((el) => {
    const ms = +el.dataset.dep - now.getTime(), toStart = +el.dataset.start - now.getTime();
    el.classList.toggle("go", ms <= 0 && toStart > 0);
    el.textContent = ms > 0 ? (ms < 36e5 * 12 ? "· in " + durText(Math.ceil(ms / 60e3)) : "") : toStart > 0 ? "· jetzt los!" : "";
  });
  document.querySelectorAll(".left[data-end]").forEach((el) => {
    const rest = Math.max(0, +el.dataset.end * 60 - secs);
    el.textContent = leftText(rest);
  });
  const wk = document.querySelector(".wk[data-h0]");
  const line = document.querySelector(".nowline");
  if (!wk || !line) return;
  const h0 = +wk.dataset.h0, h1 = +wk.dataset.h1, HH = +wk.dataset.hh;
  const pos = (secs / 3600 - h0) * HH;
  const inside = pos >= 0 && pos <= (h1 - h0) * HH;
  line.hidden = !inside;
  line.style.top = pos + "px";
  const lbl = document.querySelector(".gut .nowlbl");
  if (lbl) { lbl.hidden = !inside; lbl.style.top = pos + "px"; lbl.textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}`; }
}

/* ---------- Mensa ----------
   Quelle: Speiseplan der Seezeit-Mensa Ravensburg (XML von max-manager.de).
   Zuerst wird mensa.xml aus dem eigenen Repo geladen (eine GitHub Action holt sie täglich),
   sonst wird versucht, die Datei direkt bei Seezeit zu laden. */
const MENSA_XML = "https://www.max-manager.de/daten-extern/seezeit/xml/mensa_ravensburg/speiseplan.xml";
const MENSA_PAGE = "https://seezeit.com/essen/speiseplaene/mensa-ravensburg/";

function cleanDish(t) {
  return String(t || "")
    .replace(/\s*\(\s*\d+[a-z]?(?:\s*,\s*\d+[a-z]?)*\s*\)/gi, "")   /* Zusatzstoff-Nummern wie (3,25a,33) weg */
    .replace(/\s*,\s*/g, ", ").replace(/\(\s*/g, "(").replace(/\s*\)/g, ")")

}
function parseMensa(text) {
  const doc = new DOMParser().parseFromString(text, "application/xml");
  if (doc.querySelector("parsererror") || !doc.querySelector("speiseplan")) return null;
  const val = (it, n) => { const x = it.querySelector(n); return x ? x.textContent.trim() : ""; };
  const days = [];
  doc.querySelectorAll("speiseplan > tag").forEach((tg) => {
    const ts = +tg.getAttribute("timestamp");
    if (!ts) return;
    const items = [...tg.querySelectorAll("item")]
      .filter((it) => (it.getAttribute("language") || "de") === "de")
      .map((it) => {
        const cat = val(it, "category").replace(/\s+[IVX]+$/, "").replace(/^Sättigung$/i, "Beilage");
        const full = cleanDish(val(it, "title"));
        const [name, ...extra] = full.split(/\s+dazu\s+/i);
        return { cat, name, extra: extra.length ? "dazu " + extra.join(" dazu ") : "", raw: val(it, "title"), p: [val(it, "preis1"), val(it, "preis2"), val(it, "preis3")] };
      })
      .filter((d) => d.name);
    if (items.length) days.push({ date: berlinKey(ts * 1000 + 3 * 3600e3), items });

    const live = await fetchMensa(MENSA_XML);

const PHOTO_CACHE = "semesterplaner.mensafotos.v2";
try { localStorage.removeItem("semesterplaner.mensafotos.v1"); } catch (e) { /* egal */ }
function catFallback(cat, name) {
  const s = (cat + " " + name).toLowerCase();
  if (/dessert|joghurt|pudding|quark/.test(s)) return "Dessert";
  if (/vegan|pflanzlich/.test(s)) return "Vegan";
  if (/salat|sättigung|beilage/.test(s)) return "Side";
  if (/gemüse|vegetar|veggie/.test(s)) return "Vegetarian";
  return "Miscellaneous";
}
function photoPlan(name, cat) {
  const head = name.split(/\s+(?:mit|dazu|an|auf)\s+/i)[0].toLowerCase();
  const full = name.toLowerCase();
  /* Das Hauptwort (vor "mit") zählt zuerst. Ist es nur allgemein (Nudeln, Kartoffeln …), darf ein genaueres Stichwort aus dem ganzen Namen gewinnen. */
  const idx = (t) => PHOTO_RULES.findIndex(([re]) => re.test(t));
  const generic = PHOTO_RULES.findIndex(([re]) => re.test("suppe"));
  let i = idx(head);
  const j = idx(full);
  if (i < 0 || (i >= generic && j >= 0 && j < generic)) i = j;
  const rule = i >= 0 ? PHOTO_RULES[i][1] : null;
  return { wiki: rule && rule.wiki, meal: (rule && rule.meal) || [], cat: (rule && rule.cat) || catFallback(cat, name) };

const hashStr = (s) => { let h = 7; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; };
const apiMem = new Map();
function getJSON(u) {
  if (!apiMem.has(u)) apiMem.set(u, fetch(u).then((r) => { if (!r.ok) throw new Error("http " + r.status); return r.json(); }).catch((e) => { apiMem.delete(u); throw e; }));
  return apiMem.get(u);
}
const mealPhoto = (m) => ({ src: m.strMealThumb, small: m.strMealThumb + "/small", href: "https://www.themealdb.com/meal/" + m.idMeal, by: "TheMealDB: " + m.strMeal });
async function wikiTitlePhoto(title) {
  const j = await getJSON("https://de.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=pageimages&piprop=thumbnail&pithumbsize=800&titles=" + encodeURIComponent(title));
  const p = Object.values((j.query && j.query.pages) || {}).find((x) => x.thumbnail && !/\.svg/i.test(x.thumbnail.source));
  return p ? { src: p.thumbnail.source, small: p.thumbnail.source.replace(/\/\d+px-/, "/160px-"), href: "https://de.wikipedia.org/wiki/" + encodeURIComponent(p.title.replace(/ /g, "_")), by: "Wikipedia: " + p.title } : null;
}
async function mealSearchPhoto(term, name) {
  const j = await getJSON(MEALDB + "search.php?s=" + encodeURIComponent(term));
  const list = (j.meals || []).filter((m) => m.strMealThumb);
  return list.length ? mealPhoto(list[hashStr(name) % list.length]) : null;
}
async function mealCatPhoto(cat, name) {
  const j = await getJSON(MEALDB + "filter.php?c=" + encodeURIComponent(cat));
  const list = (j.meals || []).filter((m) => m.strMealThumb);
  return list.length ? mealPhoto(list[hashStr(name) % list.length]) : null;
}
const photoMem = new Map();
let photoStore = null;
function photoCache() {
  if (photoStore) return photoStore;
  try { photoStore = JSON.parse(localStorage.getItem(PHOTO_CACHE) || "{}") || {}; } catch (e) { photoStore = {}; }
  return photoStore;
}
function photoRemember(q, r) {
  const c = photoCache(); c[q] = r;
  try { localStorage.setItem(PHOTO_CACHE, JSON.stringify(c)); } catch (e) { /* egal */ }
}
function photoFor(name, cat) {
  if (photoMem.has(name)) return photoMem.get(name);
  const c = photoCache();
  if (c[name]) { const r = Promise.resolve(c[name]); photoMem.set(name, r); return r; }
  const job = (async () => {
    const plan = photoPlan(name, cat);
    const tries = [];
    if (plan.wiki) tries.push(() => wikiTitlePhoto(plan.wiki));
    plan.meal.forEach((t) => tries.push(() => mealSearchPhoto(t, name)));
    tries.push(() => mealCatPhoto(plan.cat, name));
    let netErr = false;
    for (const t of tries) {
      try { const r = await t(); if (r) { photoRemember(name, r); return r; } } catch (e) { netErr = true; }
    }
    if (netErr) photoMem.delete(name); /* Netzfehler: später nochmal versuchen */
    return null;
  })();
  photoMem.set(name, job);
  return job;
}

    img.onerror = () => { if (small && img.src !== r.src) { img.src = r.src; return; } el.classList.remove("wait"); img.remove(); };
    img.src = small ? r.small || r.src : r.src;
    el.prepend(img);

  });

  + "&hourly=temperature_2m,precipitation_probability,weather_code,is_day"
  + "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max";
const WX_CACHE = "semesterplaner.wetter.v1";
const wx = { data: null, at: 0, err: false };
const WMO = {
  0: ["Klar", "☀️", "🌙"], 1: ["Überwiegend klar", "🌤️", "🌙"], 2: ["Teils bewölkt", "⛅", "☁️"], 3: ["Bedeckt", "☁️"],
  45: ["Nebel", "🌫️"], 48: ["Nebel mit Reif", "🌫️"],
  51: ["Leichter Niesel", "🌦️", "🌧️"], 53: ["Nieselregen", "🌧️"], 55: ["Starker Niesel", "🌧️"], 56: ["Gefrierender Niesel", "🌧️"], 57: ["Gefrierender Niesel", "🌧️"],
  61: ["Leichter Regen", "🌦️", "🌧️"], 63: ["Regen", "🌧️"], 65: ["Starker Regen", "🌧️"], 66: ["Gefrierender Regen", "🌧️"], 67: ["Gefrierender Regen", "🌧️"],
  71: ["Leichter Schneefall", "🌨️"], 73: ["Schneefall", "🌨️"], 75: ["Starker Schneefall", "❄️"], 77: ["Schneegriesel", "🌨️"],
  80: ["Leichte Schauer", "🌦️", "🌧️"], 81: ["Regenschauer", "🌧️"], 82: ["Heftige Schauer", "⛈️"], 85: ["Schneeschauer", "🌨️"], 86: ["Starke Schneeschauer", "❄️"],
  95: ["Gewitter", "⛈️"], 96: ["Gewitter mit Hagel", "⛈️"], 99: ["Gewitter mit Hagel", "⛈️"]
};
const wmo = (code, day = 1) => { const w = WMO[code] || ["", "🌡️"]; return { text: w[0], icon: (!day && w[2]) || w[1] }; };
const deg = (v) => (v == null ? "–" : Math.round(v) + "°");
function wxDay(k) {
  const d = wx.data && wx.data.daily;
  if (!d) return null;
  const i = d.time.indexOf(k);
  return i < 0 ? null : { code: d.weather_code[i], max: d.temperature_2m_max[i], min: d.temperature_2m_min[i], pp: d.precipitation_probability_max ? d.precipitation_probability_max[i] : null };
}
function renderWeather() {
  const el = $("#wx");
  if (!wx.data) {
    el.hidden = !wx.err;
    el.className = "panel wx err";
    el.innerHTML = `Wetter gerade nicht erreichbar. <a href="https://www.dwd.de/DE/wetter/wetterundklima_vorort/baden-wuerttemberg/ravensburg/_node.html" target="_blank" rel="noopener">Wetter beim DWD ansehen</a>`;
    return;
  }
  const c = wx.data.current, h = wx.data.hourly;
  const now = wmo(c.weather_code, c.is_day);
  const today = wxDay(key(new Date()));
  const hourKey = c.time.slice(0, 13);
  let i0 = h.time.findIndex((t) => t.slice(0, 13) === hourKey);
  if (i0 < 0) i0 = 0;
  const hours = h.time.slice(i0, i0 + 12).map((t, j) => {
    const i = i0 + j, w = wmo(h.weather_code[i], h.is_day ? h.is_day[i] : 1), pp = h.precipitation_probability ? h.precipitation_probability[i] : null;
    return `<div class="h" title="${esc(w.text)}"><span class="hh">${j === 0 ? "Jetzt" : t.slice(11, 13) + " Uhr"}</span><span class="hi">${w.icon}</span><span class="ht">${deg(h.temperature_2m[i])}</span><span class="hp">${pp >= 20 ? pp + " %" : ""}</span></div>`;
  }).join("");
  const stand = fmt(new Date(wx.at), { hour: "2-digit", minute: "2-digit" });
  el.className = "panel wx";
  el.hidden = false;
  el.innerHTML = `<div class="now"><span class="ic" aria-hidden="true">${now.icon}</span>
      <div><div class="t">${deg(c.temperature_2m)}</div>
      <div class="d">${esc(now.text)} · gefühlt ${deg(c.apparent_temperature)}${today ? ` · <b>${deg(today.max)}</b> / ${deg(today.min)}` : ""}${today && today.pp != null ? ` · Regen ${today.pp} %` : ""}</div></div></div>
    <div class="hrs" aria-label="Die nächsten Stunden">${hours}</div>
    <div class="src">Ravensburg · Wind ${Math.round(c.wind_speed_10m)} km/h · Daten: DWD-Modell ICON über <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> · Stand ${stand} Uhr</div>`;
}
async function loadWeather(force) {
  try {
    const c = JSON.parse(localStorage.getItem(WX_CACHE) || "null");
    if (c && c.data && !wx.data) { wx.data = c.data; wx.at = c.at; }
    if (!force && c && Date.now() - c.at < 20 * 60e3) { renderWeather(); return; }
  } catch (e) { /* kein Zwischenspeicher */ }
  try {
    const r = await fetch(WX_URL);
    if (!r.ok) throw new Error("http " + r.status);
    const j = await r.json();
    if (!j.current || !j.daily) throw new Error("leer");
    wx.data = j; wx.at = Date.now(); wx.err = false;
    try { localStorage.setItem(WX_CACHE, JSON.stringify({ at: wx.at, data: j })); } catch (e) { /* egal */ }
  } catch (e) { wx.err = true; }
  renderWeather();
  if (view === "week") render();
}

/* ---------- Anfahrt ----------
   Fahrzeit + Puffer vor Terminbeginn = Abfahrtszeit. Einstellungen bleiben im Browser gespeichert.
   "first": nur vor dem ersten Termin des Tages. "gaps": zusätzlich nach Pausen, die lang genug sind,
   um heimzufahren (hin und zurück plus mindestens 30 Minuten daheim). */
const TRAVEL_KEY = "semesterplaner.anfahrt.v1";
const travel = { on: false, min: 30, buf: 5, mode: "first" };
try { const t = JSON.parse(localStorage.getItem(TRAVEL_KEY) || "null"); if (t) Object.assign(travel, t); } catch (e) { /* Standardwerte */ }
function saveTravel() { try { localStorage.setItem(TRAVEL_KEY, JSON.stringify(travel)); } catch (e) { /* egal */ } }
const hm = (m) => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
function durText(min) {
  if (min < 60) return `${min} min`;
  const h = Math.floor(min / 60), m = min % 60;
  return m ? `${h} h ${m} min` : `${h} h`;
}
function departures(list) {
  const out = new Map();
  if (!travel.on) return out;
  const lead = travel.min + travel.buf;
  const byDay = new Map();
  list.forEach((e) => { if (!byDay.has(e.date)) byDay.set(e.date, []); byDay.get(e.date).push(e); });
  for (const evs of byDay.values()) {
    evs.sort((x, y) => x.a - y.a);
    let lastEnd = null;
    for (const e of evs) {
      const longGap = lastEnd != null && e.a - lastEnd >= 2 * travel.min + 30;
      if (lastEnd == null || (travel.mode === "gaps" && longGap)) out.set(e.id, { dep: Math.max(0, e.a - lead), first: lastEnd == null });
      lastEnd = Math.max(lastEnd == null ? 0 : lastEnd, e.b);
    }
  }
  return out;
}
const visible = () => all().filter((e) => !hidden.has(filterKey(e)));
const depMs = (date, m) => parseKey(date).getTime() + m * 60e3; /* ohne Zeitumstellung-Sonderfall, reicht für die Anzeige */
function nextDeparture() {
  const deps = departures(visible()), now = Date.now();
  return all().map((e) => ({ e, d: deps.get(e.id) })).find((x) => x.d && depMs(x.e.date, x.e.a) > now) || null;
}
function renderTravel() {
  const b = $("#travelbtn");
  b.classList.toggle("on", travel.on);
  b.querySelector(".pill").textContent = travel.on ? `${travel.min + travel.buf} min` : "aus";
  $("#tOn").checked = travel.on;
  if (document.activeElement !== $("#tMin")) $("#tMin").value = travel.min;
  if (document.activeElement !== $("#tBuf")) $("#tBuf").value = travel.buf;
  $("#tMode").value = travel.mode;
  $("#travelpanel").classList.toggle("off", !travel.on);
  let info = "Gib ein, wie lange du zur Hochschule brauchst. Der Kalender zeigt dann, wann du losfahren musst.";
  if (travel.on) {
    const n = nextDeparture();
    info = n
      ? `Nächste Abfahrt: ${relLabel(n.e.date)} um ${hm(n.d.dep)} Uhr, damit du um ${n.e.start} bei „${titleOf(n.e)}“ bist (${travel.min} min Fahrt + ${travel.buf} min Puffer).`
      : "Keine kommenden Termine.";
  }
  $("#tInfo").textContent = info;
}
$("#travelbtn").addEventListener("click", () => {
  const p = $("#travelpanel"); p.hidden = !p.hidden;
  $("#travelbtn").setAttribute("aria-expanded", String(!p.hidden));
  renderTravel();
});
$("#tOn").addEventListener("change", (ev) => { travel.on = ev.target.checked; saveTravel(); render(); });
function numIn(el, lo, hi, fb) { const v = Math.round(+el.value); return Number.isFinite(v) && el.value !== "" ? Math.min(hi, Math.max(lo, v)) : fb; }
$("#tMin").addEventListener("input", (ev) => { travel.min = numIn(ev.target, 1, 300, travel.min); saveTravel(); render(); });
$("#tBuf").addEventListener("input", (ev) => { travel.buf = numIn(ev.target, 0, 120, travel.buf); saveTravel(); render(); });
$("#tMode").addEventListener("change", (ev) => { travel.mode = ev.target.value === "gaps" ? "gaps" : "first"; saveTravel(); render(); });
["#tMin", "#tBuf"].forEach((s) => $(s).addEventListener("blur", () => renderTravel()));

/* ---------- Klicks ---------- */
function disarmLater() { clearTimeout(armTimer); armTimer = setTimeout(() => { armed = null; render(); }, 4000); }
document.addEventListener("click", async (ev) => {
  const el = ev.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  if (act !== "del") armed = null;
  if (act === "prev") weekStart = addDays(weekStart, -7);
  else if (act === "next") weekStart = addDays(weekStart, 7);
  else if (act === "today") weekStart = monday(new Date());
  else if (act === "past") showPast = !showPast;
  else if (act === "mday") mensa.day = el.dataset.date;
  else if (act === "mreload") { mensa.state = "idle"; }
  else if (act === "chip") { const k = el.dataset.k; hidden.has(k) ? hidden.delete(k) : hidden.add(k); }
  else if (act === "sel") sel = sel === el.dataset.id ? null : el.dataset.id;
  else if (act === "goto") { view = "week"; weekStart = monday(parseKey(el.dataset.date)); if (el.dataset.id) sel = el.dataset.id; }
  else if (act === "del") {
    const id = el.dataset.id;
    if (armed !== id) { armed = id; disarmLater(); render(); return; }
    clearTimeout(armTimer); armed = null;
    try {
      if (id.startsWith("course:")) {
        const [kd, ...rest] = id.slice(7).split("|"); const t = rest.join("|");
        for (const e of all().filter((x) => x.title === t && x.kind === kd)) await delEv(e.id);
      } else await delEv(id);
    } catch (err) { $("#addmsg").textContent = "Löschen hat nicht geklappt."; }
    sel = null;
  }
  render();
});
$("#tabweek").addEventListener("click", () => { view = "week"; armed = null; render(); });
$("#tablist").addEventListener("click", () => { view = "list"; armed = null; render(); });
$("#tabmensa").addEventListener("click", () => { view = "mensa"; armed = null; render(); });

$("#expcopy").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText(exportText()); $("#expmsg").textContent = "Kopiert. Auf GitHub termine.js öffnen, alles ersetzen, speichern."; }
  catch (e) { $("#expmsg").textContent = "Kopieren ging nicht. Nutze stattdessen das Herunterladen."; }
});
$("#expdl").addEventListener("click", async () => {
  await saveFile("termine.js", exportText());
  $("#expmsg").textContent = "Lade termine.js auf GitHub hoch und ersetze die alte Datei.";
});
$("#expreset").addEventListener("click", () => {
  try { localStorage.removeItem(WORK); } catch (e) { /* egal */ }
  loadData(); updateExport(); render();
  $("#expmsg").textContent = "Zurückgesetzt auf den veröffentlichten Stand.";
});

/* ---------- Start ---------- */
function showEdit() {
  $("#addpanel").hidden = !EDIT; $("#exportpanel").hidden = !EDIT;
  setStatus(); updateExport();
}
function boot() {
  loadData();
  showEdit();
  render();
  setInterval(tick, 1000);
  loadWeather();
  setInterval(() => { if (!document.hidden) loadWeather(true); }, 30 * 60e3);
  connect();
}
/* termine.js immer frisch laden, damit kein alter Zwischenspeicher alte Termine zeigt */
(function () {
  let done = false;
  const go = () => { if (!done) { done = true; boot(); } };
  const sc = document.createElement("script");
  sc.src = "../termine.js?t=" + Date.now();
  sc.onload = go; sc.onerror = go;
  document.head.appendChild(sc);
  setTimeout(go, 4000);
})();
async function connect() {
  if (!(window.claude && window.claude.use)) return;
  try {
    const db = await window.claude.use("db");
    if (db) {
      dbRef = db; EDIT = true; showEdit();
      db.collection("termine").onSnapshot((snap) => {
        events = {};
        snap.docs.forEach((d) => { events[d.id] = clean(d.data()); });
        updateExport(); render();
      }, () => { dbRef = null; loadData(); showEdit(); render(); });
    }
    const s = await window.claude.use("sample");
    if (s && s.json) {
      const lim = await s.limits().catch(() => null);
      if (lim && lim.images) { sampleFn = s; $("#photofile").accept = lim.images.mediaTypes.join(","); $("#photobox").hidden = false; }
    }
  } catch (e) { /* bleibt bei der statischen Ansicht */ }
}
</script>
